# .github/workflows/deploy-gh-pages.yml
name: Build & Deploy to gh-pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # подтягиваем секрет из настроек репозитория
      API_ORIGIN: ${{ secrets.API_ORIGIN }}
      NODE_ENV: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          fetch-depth: 0        # нужно для пуша в gh-pages

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          # ветка, в которую пушим статические файлы
          publish_branch: gh-pages
          # директория с результатом сборки
          publish_dir: ./dist
          # GitHub автоматически предоставляет этот токен
          github_token: ${{ secrets.GITHUB_TOKEN }}
